# Monta o instalador do Zeno a partir do código privado (adrianoraki/Zeno) e publica aqui.
# Roda neste repositório público porque aqui o GitHub Actions é gratuito.
# Precisa do segredo ZENO_TOKEN: token do GitHub com leitura (Contents: Read) do repositório privado Zeno.
# Disparo: aba Actions > "Lançar versão" > Run workflow (marque "publicar" para lançar; sem marcar, só testa).
# A versão vem do $TurboVersion do Zeno.ps1 e as novidades da seção "## X.Y" do NOVIDADES.md.
name: Lançar versão

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar a versão (sem marcar = só testar)'
        type: boolean
        default: false
      ref:
        description: 'Ramo ou commit do Zeno'
        default: 'main'

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-2022
    steps:
      - name: Baixar o código do Zeno (privado)
        uses: actions/checkout@v4
        with:
          repository: adrianoraki/Zeno
          ref: ${{ inputs.ref }}
          token: ${{ secrets.ZENO_TOKEN }}
          path: zeno
          fetch-depth: 0

      - name: Conferir versão
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path zeno/Zeno.ps1 -Pattern "^\`$TurboVersion = '([\d.]+)'" | Select-Object -First 1
          if (-not $m) { throw 'Não achei $TurboVersion no Zeno.ps1' }
          $v = $m.Matches[0].Groups[1].Value
          if ('${{ inputs.publicar }}' -eq 'true') {
            $tags = @(gh release list --repo ${{ github.repository }} --limit 200 --json tagName --jq '.[].tagName')
            if ($tags -contains "v$v") { throw "A versão v$v já foi publicada. Aumente o \$TurboVersion no Zeno.ps1." }
          }
          "versao=$v" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Conferir sintaxe do zeno/Zeno.ps1
        shell: powershell
        run: |
          $err = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path zeno/Zeno.ps1), [ref]$null, [ref]$err)
          if ($err) { $err | ForEach-Object { "Linha $($_.Extent.StartLineNumber): $($_.Message)" }; throw 'zeno/Zeno.ps1 tem erro de sintaxe' }
          'Sintaxe OK'

      - name: Testar a licença (chave assinada como a Kivo faz)
        shell: powershell
        run: |
          if (Test-Path zeno\tests\licenca.ps1) {
            python zeno\tests\gerar_chaves.py | Set-Content -Path chaves-teste.json -Encoding utf8
            powershell -NoProfile -ExecutionPolicy Bypass -File zeno\tests\licenca.ps1 chaves-teste.json zeno\Zeno.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Teste da licença falhou' }
          }

      - name: Testar a voz (Thalita e Antonio)
        shell: powershell
        run: |
          if (Test-Path zeno\tests\voz.ps1) {
            powershell -NoProfile -ExecutionPolicy Bypass -File zeno\tests\voz.ps1 zeno\Zeno.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Teste da voz falhou' }
          }

      - name: Guardar amostras das vozes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amostras-voz
          path: amostras-voz/*.wav
          if-no-files-found: ignore

      - name: Compilar Zeno.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force zeno\dist | Out-Null
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /codepage:65001 /win32icon:zeno\Zeno.ico /r:System.Windows.Forms.dll /out:zeno\dist\Zeno.exe zeno\launcher\ZenoLauncher.cs
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar o Zeno.exe' }

      - name: Gerar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Q "/DMyAppVersion=${{ steps.ver.outputs.versao }}" zeno\installer\Zeno.iss
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar o instalador' }
          $h = (Get-FileHash zeno\dist\Zeno-Setup.exe -Algorithm SHA256).Hash
          Set-Content -Path zeno\dist\Zeno-Setup.exe.sha256 -Value "$h  Zeno-Setup.exe" -Encoding ascii -NoNewline
          "SHA256: $h"

      - name: Notas da versão
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.versao }}'
          $n = @(); $in = $false
          if (Test-Path zeno/NOVIDADES.md) {
            foreach ($l in Get-Content zeno/NOVIDADES.md -Encoding utf8) {
              if ($l -match '^##\s+(.+)$') { $in = ($Matches[1].Trim() -eq $v); continue }
              if ($in -and $l.Trim()) { $n += $l.Trim() }
            }
          }
          if ($n.Count -eq 0) { $n = @('- Melhorias e correções.') }
          Set-Content -Path zeno\dist\notas.md -Value ($n -join "`n") -Encoding utf8
          $n

      - uses: actions/upload-artifact@v4
        with:
          name: Zeno-Setup-${{ steps.ver.outputs.versao }}
          path: zeno/dist/Zeno-Setup.exe*

      - name: Publicar a versão
        if: inputs.publicar
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.ver.outputs.versao }}'
          gh release create "v$v" zeno\dist\Zeno-Setup.exe zeno\dist\Zeno-Setup.exe.sha256 --repo ${{ github.repository }} --title "Zeno $v" --notes-file zeno\dist\notas.md
